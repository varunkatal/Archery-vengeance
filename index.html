<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- This line makes the page fit phone screens properly -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archery Vengeance</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <!-- gameArea is the full-width space the game is allowed to use -->
    <div id="gameArea">
      <!-- gameContainer is exactly the size of the canvas, so the
           Start screen can sit right on top of it -->
      <div id="gameContainer">
        <!-- The game scene is drawn inside this canvas by game.js -->
        <canvas id="gameCanvas"></canvas>

        <!-- Start screen: shown on top of the canvas before the game begins -->
        <div id="startScreen" class="overlay">
          <h1>Archery Vengeance</h1>
          <p>Aim carefully. Every arrow counts.</p>
          <button id="startButton" type="button">Start</button>
        </div>
      </div>
    </div>

    <!-- Short instructions shown under the game -->
    <section id="instructions">
      <h2>How to play</h2>
      <p>Move the mouse (or drag your finger) to aim. Click (or lift your finger) to shoot.</p>
      <p>Hit the target to score. Miss 3 times and the game is over!</p>
    </section>
  </main>

  <!-- Load the game code last, after everything above exists on the page -->
  <script src="game.js"></script>
</body>
</html>
